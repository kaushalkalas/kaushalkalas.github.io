<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <title>404 — Kaushal Kalas</title>
  <meta name="description" content="Page not found. The portfolio of Kaushal Kalas lives one directory up — type 'help' to see what actually exists." />
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #0b0b0c;
      color: #c9c6bd;
      font: 16px/1.6 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid #f5a623; outline-offset: 2px; }

    .terminal-window {
      width: min(672px, 100%);
      background: #141417;
      border: 1px solid #26262b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 178, 0, 0.06);
    }
    .titlebar {
      height: 40px;
      background: #1c1c20;
      border-bottom: 1px solid #1e1e22;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
    }
    .dots { display: inline-flex; gap: 8px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: #7a7a84; }
    .title { font-size: 0.75rem; letter-spacing: 0.04em; color: #9a9aa3; white-space: nowrap; }

    .output {
      background: #08080a;
      padding: 20px 16px 24px;
      font-size: 14px;
      line-height: 1.7;
      color: #ffb200;
    }
    .out-line { word-break: break-word; }
    .prompt { color: #f5a623; }
    .cmd { color: #f5f2e8; }
    .error { color: #ffb200; }
    .dim { color: rgba(255, 178, 0, 0.72); }

    .paths {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    .paths a {
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      line-height: 1.4;
      color: #9a9aa3;
      background: transparent;
      border: 1px solid #26262b;
      border-radius: 2px;
      padding: 3px 8px;
    }
    .paths a:hover { color: #cf8213; border-color: #f5a623; }

    .home-line { margin-top: 16px; font-size: 14px; }
    .home-line a { color: #cf8213; }
    .home-line a:hover { text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 640px) {
      body { font-size: 14px; }
      .output { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="terminal-window">
      <div class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="title">kaushal@debian:~ — bash</span>
        <span aria-hidden="true"></span>
      </div>
      <div class="output" role="log">
        <div class="out-line"><span class="prompt">kaushal@debian:~$</span> <span class="cmd" id="typed-cmd">cd</span></div>
        <div class="out-line error" id="err-line">bash: cd: : No such file or directory</div>
        <div class="out-line dim">Type 'help' to see what actually exists.</div>
        <div class="paths" aria-label="What actually exists">
          <a href="#" data-dest="">$ whoami</a>
          <a href="#projects" data-dest="projects">$ projects</a>
          <a href="#gallery" data-dest="gallery">$ gallery</a>
          <a href="#contact" data-dest="contact">$ contact</a>
          <a href="assets/resume/Kaushal_Kalas_Resume.pdf" data-dest="resume">resume.pdf</a>
        </div>
        <div class="out-line home-line">cd -- <a id="home-link">~/</a></div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var path;
      try { path = decodeURI(location.pathname); } catch (e) { path = location.pathname; }
      var miss = path.replace(/\/$/, "") || "/";
      document.getElementById("typed-cmd").textContent = "cd " + miss;
      document.getElementById("err-line").textContent = "bash: cd: " + miss + ": No such file or directory";

      // Keep origin + first path segment (the GitHub Pages site root — e.g. /portfolio/).
      var seg = (location.pathname.match(/^\/[^/]+\//) || [""])[0];
      var home = location.origin + seg;
      document.getElementById("home-link").setAttribute("href", home);

      Array.prototype.forEach.call(document.querySelectorAll(".paths a"), function (a) {
        var dest = a.getAttribute("data-dest");
        a.setAttribute("href", dest ? home + "#" + dest : home + "resume/" === (home + "resume/") ? home : a.getAttribute("href"));
      });
    })();
  </script>
</body>
</html>
